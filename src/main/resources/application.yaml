spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: payment
  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  sql:
    init:
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

grpc:
  server:
    port: 9091

payment:
  cors:
    origins: ${PAYMENT_CORS_ORIGINS:}
  dev:
    enabled: ${PAYMENT_DEV_ENABLED:false}
  deal:
    target: ${DEAL_GRPC_TARGET:localhost:9090}
  gateway-mode: ${PAYMENT_GATEWAY_MODE:fake}
  stripe:
    payout-mode: ${STRIPE_PAYOUT_MODE:ledger}
    sandbox-host-account-id: ${STRIPE_SANDBOX_HOST_ACCOUNT_ID:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
