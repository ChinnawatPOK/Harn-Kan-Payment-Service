spring:
  application:
    name: payment
  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8082}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}

payment:
  gateway-mode: ${PAYMENT_GATEWAY_MODE:fake}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

deal:
  service:
    host: ${DEAL_SERVICE_HOST:localhost}
    port: ${DEAL_SERVICE_PORT:9090}
  callback:
    enabled: ${DEAL_CALLBACK_ENABLED:true}
