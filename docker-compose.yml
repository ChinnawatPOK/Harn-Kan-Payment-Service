# Runs only the Payment Service. MySQL comes from ../docker-dependencies (start that first).
# Stripe keys etc. are read from .env (git-ignored); see .env.example.
services:

  payment-service:
    build: .
    container_name: harnkan-payment-service
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8082:8082"   # Payment REST API (the gateway routes /api/payments/** here)
      - "9091:9091"   # Payment gRPC: CreatePayment, CancelPayment, RefundDeal
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      # Payment calls Deal's gRPC (DG5 UpdateParticipantPayment) when a payment changes by its own doing.
      DEAL_SERVICE_HOST: ${DEAL_SERVICE_HOST:-host.docker.internal}
      DEAL_SERVICE_PORT: ${DEAL_SERVICE_PORT:-9090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [harnkan-net]

networks:
  harnkan-net:
    external: true
