services:

  payment-service:
    build: .
    container_name: harnkan-payment-service
    restart: unless-stopped
    ports:
      - "8080:8080"   # Payment REST API
      - "9091:9091"   # Payment gRPC: CreatePayment, RefundDeal
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: harnkan-payment-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: harnkan_payment
      TZ: Asia/Bangkok
    command: --default-time-zone='+07:00'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
