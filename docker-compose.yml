services:

  payment-service:
    build: .
    container_name: harnkan-payment-service
    restart: unless-stopped
    ports:
      - "8082:8082"   # Payment REST API (the gateway routes /api/payments/** here)
      - "9091:9091"   # Payment gRPC: CreatePayment, CancelPayment, RefundDeal
    environment:
      SERVER_PORT: 8082
      PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PAYOUT_MODE: ${STRIPE_PAYOUT_MODE:-ledger}
      STRIPE_SANDBOX_HOST_ACCOUNT_ID: ${STRIPE_SANDBOX_HOST_ACCOUNT_ID:-}
      STRIPE_TEST_TRANSFER_ENABLED: ${STRIPE_TEST_TRANSFER_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      # Payment calls Deal's gRPC (DG5 UpdateParticipantPayment) when a payment changes by its own doing.
      DEAL_SERVICE_HOST: ${DEAL_SERVICE_HOST:-host.docker.internal}
      DEAL_SERVICE_PORT: ${DEAL_SERVICE_PORT:-9090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
